<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StarBucks - Landing Page</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <header>
            <div class="logo">
                <img src="../starimg/StarBucksLogo.png" alt="StarBucks">
            </div>
            <nav class="nav-menu">
                <a href="#" class="active">Home</a>
                <a href="#">Select</a>
                <a href="#">Shop</a>
            </nav>
            <div class="burger-menu">
                <span></span><span></span><span></span>
            </div>
        </header>

        <main class="hero-section">
            <div>
                <img src="../starimg/New Cafe by StarBucks.png">
                <p class="description">
                    Have time to buy the most harmonious drinks in the new Starbucks coffee and don't forget about the discount!
                </p>
                <div class="btn-group">
                    <button class="btn-image">
                        <img src="../starimg/SelectACoffee.png" alt="Select a coffee">
                    </button>
                    <button class="btn-image">
                        <img src="../starimg/More.png" alt="More">
                    </button>
                </div>
                
                    <div class="stats">
                <div class="stat-item">
                    <img src="../starimg/9K+.png" alt="9k" class="stat-img">
                </div>
                <div class="stat-item">
                    <img src="../starimg/2K+.png" alt="2k" class="stat-img">
                </div>
                <div class="stat-item">
                    <img src="../starimg/28K+.png" alt="28" class="stat-img">
                </div>
            </div>
            </div>

            <div class="hero-image">
                <img src="../starimg/PumpkinCup.png" alt="Starbucks Cup" class="main-cup">
                <img src="../starimg/lines.png" alt="Lines" class="bg-lines">
            </div>
        </main>

            <section class="features-panel">
            <img src="../starimg/WeHaveBadge.png" alt="We Have" class="we-have-badge">
        <div class="feature-card">
            <img src="../starimg/TASTY.png" alt="Tasty" class="feature-icon">
        </div>
        <div class="feature-card">
            <img src="../starimg/FAST.png" alt="Fast" class="feature-icon">
        </div>
        <div class="feature-card">
            <img src="../starimg/AVAILABLE.png" alt="Available" class="feature-icon">
        </div>
    </section>
    </div>

    <section class="about-section">
        <img src="../starimg/lines2.png" alt="" class="about-lines">
    <div class="about-container">
        <div class="about-image-wrapper">
            <img src="../starimg/Interior.png" alt="Cafe Interior" class="interior-img">
            <img src="../starimg/WeHaveBadge.png" alt="We Have" class="about-badge">
        </div>
        <div class="about-content">
            <img src="../starimg/We make delicious.png" alt="We make delicious" class="about-title-img">
            <p class="about-description">
                Only in 2021 we have made more than 100,000 orders for you, 
                your loved ones, all of you, and in 2022 we are ready to destroy the market
            </p>

            <div class="video-preview">
                <img src="../starimg/Interior2.png" alt="Cooking Process" class="video-img">
                <button class="play-btn">
                    <img src="../starimg/video btn.png" alt="Play Video">
                </button>
            </div>
        </div>
    </div>
</section>

</body>
</html>
